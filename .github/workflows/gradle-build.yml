name: Gradle Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 9.2.1
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '9.2.1'

    - name: Initialize Gradle build
      run: gradle init --type java-application --dsl groovy --package com.uranai --project-name uranai --no-comments --overwrite

    - name: Build with Gradle
      run: gradle build

    - name: Run tests
      run: gradle test

    - name: Upload Gradle files
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-files
        path: |
          build.gradle
          settings.gradle
          gradle/
          src/
          .gitignore
