name: Gradle Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 9.2.1
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '9.2.1'

    - name: Build with Gradle
      run: gradle build

    - name: Run tests
      run: gradle test
